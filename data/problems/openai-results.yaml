- id: quantum-parallel-repetition
  title: Parallel repetition for quantum games
  subjects:
  - Quantum computing
  category: Research
  question: Does repetition cause exponential decay in quantum-game success?
  caveat: An independent audit found a polarity error in a printed greedy-conditioning lemma and supplied
    a local repair. The correction does not independently verify the later sampleability, alignment,
    rounding or main parallel-repetition arguments; the Lean artifact was not rebuilt here.
  events:
  - title: Parallel repetition for quantum games
    year: '2026'
    date: '2026-08-01'
    summary: OpenAI reports a resolution with an accompanying Lean artifact. Sienicki and Sienicki later
      identified a success-versus-failure polarity error in the printed proof of a preliminary conditioning
      lemma, gave a counterexample to the printed procedure and proved a corrected version with the same
      statement and parameters. They explicitly do not claim to verify the main theorem.
    links:
    - label: OpenAI's ten advances
      url: https://github.com/openai/ten-proofs
      type: Lean
    - label: Result-specific Lean file
      url: https://github.com/openai/ten-proofs/blob/main/QuantumParallelRepetition.lean
      type: Lean
    - label: Independent audit and correction
      url: https://arxiv.org/abs/2608.14673
      type: Paper
    reported_evidence:
    - machine-checked
    - self-reported
    - disputed
    reviewed_on: '2026-09-08'
    review_note: Read the OpenAI source and the independent August 2026 audit. The audit verifies and
      repairs one preliminary lemma but does not assess the remainder of the proof; no local rebuild was performed.
    models:
    - OpenAI (unreleased)
    evidence_scope: result
    source_group: ten-proofs
