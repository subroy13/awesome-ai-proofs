- id: jacobian
  title: Jacobian conjecture in characteristic zero
  subjects:
  - Algebraic geometry
  category: Research
  question: Must a polynomial map with a nonzero constant Jacobian determinant have a polynomial inverse?
  caveat: The notes report a higher-dimensional counterexample; the two-dimensional question is separate.
  events:
  - title: Jacobian conjecture counterexample
    year: '2026'
    date: '2026-08'
    summary: Levent Alpöge and Claude Fable 5 produced an explicit three-dimensional map disproving the
      characteristic-zero conjecture; checking it is a short computation, confirmed by Tao and others,
      and [formalized in Lean by Lezeau](https://github.com/google-deepmind/formal-conjectures/pull/4474)
      against a conjecture statement written down before any counterexample existed. Gao later gave counterexamples
      in [every dimension above two](https://arxiv.org/abs/2608.00222). The two-dimensional case stays
      open.
