- id: unit-distances
  title: Erdős unit-distance problem
  subjects:
  - Discrete geometry
  category: Research
  question: How many pairs of n points in the plane can be exactly one unit apart?
  caveat: Verification details are reported in the sources; proof artifacts have not been rebuilt for
    this catalogue.
  events:
  - title: Unit-distance conjecture disproved
    year: '2026'
    date: '2026-05'
    summary: an OpenAI reasoning model disproved Erdős's 1946 conjecture by constructing point sets with
      at least n^(1+δ) unit distances, for a fixed δ > 0 and infinitely many n; outside mathematicians
      checked it and wrote [companion remarks](https://arxiv.org/abs/2605.20695). An early [Lean development](https://github.com/logical-intelligence/erdos-unit-distance)
      rested on named classical inputs; Boris Alexeev then had OpenAI's Sol autoformalize the result assuming
      nothing beyond the axioms of mathematics, about 1.2M lines, which [Buzzard compiled himself](https://xenaproject.wordpress.com/2026/07/20/human-mathematicians-are-being-outcounterexampled/).
    links:
    - label: Unit-distance conjecture disproved
      url: https://cdn.openai.com/pdf/74c24085-19b0-4534-9c90-465b8e29ad73/unit-distance-proof.pdf
      type: Paper
    - label: companion remarks
      url: https://arxiv.org/abs/2605.20695
      type: Paper
    - label: Lean development
      url: https://github.com/logical-intelligence/erdos-unit-distance
      type: Lean
    - label: Buzzard compiled himself
      url: https://xenaproject.wordpress.com/2026/07/20/human-mathematicians-are-being-outcounterexampled/
