- id: navier-stokes-forced-finite-time-blowup
  title: Navier–Stokes existence and smoothness, forced finite-time blowup
  subjects: [Partial differential equations, Analysis, Mathematical physics, Formal verification]
  category: Research
  question: For three-dimensional incompressible Navier–Stokes flow, can smooth data and smooth forcing produce finite-time breakdown while the kinetic energy remains bounded?
  caveat: This is a same-day release, not yet peer reviewed or broadly accepted by specialists. The construction uses smooth external forcing, exactly as allowed by alternatives C and D of the official Millennium Prize formulation; it does not establish unforced blowup. OpenAI does not intend to claim the prize. The public Lean project reports full, sorry-free coverage, but its review status is self-assessed and the build has not been reproduced for this catalogue.
  events:
  - title: Forced finite-time singularity on Euclidean space and the torus
    year: '2026'
    date: '2026-09-08'
    models: [OpenAI (unreleased), GPT-6 Astra, Codex]
    summary: OpenAI's internal multiagent system produced a 166-page analytical construction showing that, for every positive viscosity, a smooth compactly supported force and initially stationary smooth flow on three-dimensional Euclidean space can develop unbounded velocity in finite time while retaining bounded kinetic energy; compact support gives the corresponding periodic result. OpenAI reports that roughly 10,000 agents found the result after 88 hours, Codex consolidated intermediate insights, and GPT-6 Astra completed the Lean formalization in another 17 hours. The public metadata identifies zero-sorry Lean theorems for alternatives C and D, using only Lean's three standard axioms and Comparator statements adapted from the independently authored Formal Conjectures project.
    evidence_scope: result
    reported_evidence: [machine-checked, self-reported]
    reviewed_on: '2026-09-08'
    review_note: Read the announcement, Theorem 1.1 and proof outline, the official Clay formulation, and the repository README, formalization metadata and Comparator instructions. The 166-page proof was not audited and the Lean project was not rebuilt.
    links:
    - label: Analytical proof
      url: https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf
      type: Paper
    - label: Lean formalization
      url: https://github.com/openai/NavierStokesAndEuler
      type: Lean
    - label: OpenAI announcement
      url: https://openai.com/index/navier-stokes-solution/
      type: Context
    - label: Official Millennium Prize formulation
      url: https://www.claymath.org/wp-content/uploads/2022/06/navierstokes.pdf
      type: Context
    - label: Independent news coverage
      url: https://www.nature.com/articles/d41586-026-02842-5
      type: News
  - title: Concurrent-work attribution and data-provenance dispute
    year: '2026'
    date: '2026-09-08'
    models: [OpenAI (unreleased)]
    summary: OpenAI says it began the Millennium-problem run after hearing rumors of concurrent work by Levent Alpöge and Tristan Buckmaster, did not access their specific user data, and cannot rule out influence from de-identified training data. The concurrent result concerns forced Euler rather than this forced Navier–Stokes theorem, but Buckmaster has publicly challenged OpenAI's handling of attribution and provenance. This dispute does not by itself identify a mathematical error in the released proof.
    evidence_scope: attribution and provenance
    reported_evidence: [disputed]
    reviewed_on: '2026-09-08'
    review_note: Compared OpenAI's concurrent-work statement with same-day reporting quoting Buckmaster. No adjudication or technical proof critique was available at review time.
    links:
    - label: OpenAI concurrent-work statement
      url: https://openai.com/index/navier-stokes-solution/
      type: Context
    - label: Reporting on the dispute
      url: https://www.washingtonpost.com/technology/2026/09/09/openai-claims-it-solved-elusive-math-problem-with-1-million-prize/
      type: News

