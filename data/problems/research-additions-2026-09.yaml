    evidence_scope: result
    reported_evidence: [machine-checked, self-reported]
    reviewed_on: '2026-09-08'
    review_note: Read the announcement, paper abstract and Theorem 1.1, and the repository's scope and formalization metadata. The full proof was not audited and the Lean development was not rebuilt.
