  subjects: [Partial differential equations, Analysis, Mathematical physics, Formal verification]
  category: Research
  question: Can smooth, compactly supported, divergence-free initial data for the unforced three-dimensional incompressible Euler equations develop a singularity in finite time?
  caveat: This very recent preprint is unrefereed and has not yet received broad specialist review. Its smooth, unforced result is distinct from earlier lower-regularity blowup constructions and from the concurrent forced-Euler work of Alpöge and Buckmaster. The public Lean project reports a full formalization, but its review status is self-assessed and the build has not been reproduced for this catalogue.
