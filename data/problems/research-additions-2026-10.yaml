- id: pierce-birkhoff-conjecture
  title: Pierce–Birkhoff conjecture for piecewise polynomial functions
  subjects: [Algebra, Real algebraic geometry]
  category: Research
  question: Can every continuous, piecewise polynomial function defined on a finite semialgebraic partition of Euclidean space be expressed as a finite lattice combination of polynomials using addition, subtraction, multiplication, and maximum/minimum?
  caveat: The counterexample is an explicit continuous piecewise quadratic function on a semialgebraic partition of Euclidean space. The preprint is unrefereed and unformalized, with verification based on author checks and symbolic validation.
  events:
  - title: Piecewise quadratic counterexample
    year: '2026'
    date: '2026-09-09'
    models: [GPT-5.6, GPT-6, Claude Opus 5, Claude Fable 5.1]
    summary: Zehua Lai, Lek-Heng Lim, and Junyu Ren construct a counterexample disproving the 1956 Pierce–Birkhoff conjecture. The authors report employing a multi-agent, multi-model workflow where models assisted in exploring candidate piecewise quadratic configurations and verifying non-expressibility as polynomial lattice combinations.
    evidence_scope: counterexample
    reported_evidence: [self-reported]
    reviewed_on: '2026-10-08'
    review_note: Read the arXiv v1 abstract, construction outline, and AI-use disclosure. The full algebraic calculations were not independently reproduced.
    links:
    - label: Paper
      url: https://arxiv.org/abs/2609.10420
      type: Paper

- id: talagrand-operator-cotype
  title: Talagrand's operator cotype problem
  subjects: [Functional analysis, Probability, Banach spaces]
  category: Research
  question: Is the Rademacher cotype of a bounded linear operator between Banach spaces universally bounded by the maximum of its Gaussian cotype and its (q,1)-summing norm?
  caveat: The preprint is unrefereed, unformalized, and relies on author calculation and verification.
  events:
  - title: Negative resolution for cotype-2 operators
    year: '2026'
    date: '2026-09-17'
    models: [ChatGPT (GPT-5.6)]
    summary: Xinglong Wu resolves Michel Talagrand's operator cotype problem in the negative, demonstrating that the Rademacher cotype cannot be controlled by the Gaussian cotype and (q,1)-summing norm even in the fundamental case q = 2. The author reports that ChatGPT (GPT-5.6) discovered the counterexample structure during interactive experimentation.
    evidence_scope: counterexample
    reported_evidence: [self-reported]
    reviewed_on: '2026-10-08'
    review_note: Read the arXiv v1 abstract, theorem statement, and AI-attribution section. The operator norm calculations were not independently audited.
    links:
    - label: Paper
      url: https://arxiv.org/abs/2609.19731
      type: Paper

- id: hinrichs-vybiral-conjecture
  title: Hinrichs–Vybíral positive-definite kernel lower bound
  subjects: [Analysis, Linear algebra, Approximation theory]
  category: Research
  question: For every continuous, nonnegative, positive definite function f on Euclidean space with f(0) = 1, does the difference kernel matrix [f(x_j - x_k)] always dominate the matrix (1/n) * 1 1^T in the Loewner order?
  caveat: The preprint provides an explicit 8-point counterexample in seven dimensions. The paper has not undergone formal peer review or computer verification in an interactive theorem prover, though the finite arithmetic is directly checkable.
  events:
  - title: Seven-dimensional trigonometric polynomial counterexample
    year: '2026'
    date: '2026-09-18'
    models: [ChatGPT 6, Claude Opus 5]
    summary: Jan Vybíral presents an explicit counterexample in R^7 using eight evaluation points and a nonnegative trigonometric polynomial where the quadratic form evaluates to 22/5 against a conjectured minimum of 9/2, yielding a gap of -1/10. The author notes the counterexample was found using ChatGPT 6 in a single prompt query by a colleague, with Claude Opus 5 used during manuscript preparation.
    evidence_scope: counterexample
    reported_evidence: [self-reported]
    reviewed_on: '2026-10-08'
    review_note: Read the arXiv v1 abstract, explicit 8-point coordinates, Gram matrix evaluation, and model acknowledgement. The trigonometric evaluations were spot-checked against the manuscript values.
    links:
    - label: Paper
      url: https://arxiv.org/abs/2609.21733
      type: Paper

- id: partial-list-colouring
  title: Partial list colouring conjecture of Albertson–Grossman–Haas
  subjects: [Graph theory, Combinatorics]
  category: Research
  question: For every graph G with n vertices and list chromatic number k, and every l < k, can at least n*(l/k) vertices always be properly coloured from any l-list assignment?
  caveat: The preprint presents an explicit 14-vertex counterexample. It is an unrefereed preprint without a formal theorem prover artifact, though the finite search and graph properties are directly testable.
  events:
  - title: 14-vertex counterexample with list chromatic number three
    year: '2026'
    date: '2026-09-20'
    models: [ChatGPT 6 Astra Ultra]
    summary: Jonathan A. Noel disproves the 2000 conjecture of Albertson, Grossman, and Haas by exhibiting a 14-vertex graph of list chromatic number 3 with a 2-list assignment in which no proper colouring can colour more than 9 vertices, strictly below the conjectured bound of 14*(2/3) ≈ 9.33 vertices. The author explicitly credits ChatGPT 6 Astra Ultra with discovering and verifying the counterexample graph.
    evidence_scope: counterexample
    reported_evidence: [self-reported]
    reviewed_on: '2026-10-08'
    review_note: Read the arXiv v1 paper, list assignment tables, and AI-attribution note. The graph's independence number and list coloring bounds were not recomputed.
    links:
    - label: Paper
      url: https://arxiv.org/abs/2609.23291
      type: Paper

