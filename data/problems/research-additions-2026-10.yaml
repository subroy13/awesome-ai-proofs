  subjects: [Graph theory, Combinatorics]
  category: Research
  question: For every graph G with n vertices and list chromatic number k, and every l < k, can at least n*(l/k) vertices always be properly coloured from any l-list assignment?
  caveat: The preprint presents an explicit 14-vertex counterexample. It is an unrefereed preprint without a formal theorem prover artifact, though the finite search and graph properties are directly testable.
